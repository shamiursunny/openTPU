name: SUNNYONE remaining RTL and board regressions
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/**'
      - 'opentpu/**'
      - 'tests/test_rtl.py'
      - 'tests/test_board.py'
      - 'tests/test_axil_iso.py'
      - 'tests/conftest.py'
      - 'sim/verilator/**'
      - '.github/workflows/sunnyone-rtl-functional.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-uncovered:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build pinned Verilator 5.044 (fixes function inlining on NBA RHS)
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex bison ccache libgoogle-perftools-dev numactl perl-doc
          git clone --depth 1 --branch v5.044 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version | grep -F 'Verilator 5.044'
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Previously unrun core RTL and ISA regressions
        run: >-
          pytest -q tests/test_rtl.py
          -k "mlp_rtl or attention_decode_rtl or attention_layer_rtl or design_size_block_128_rtl or attention_decode_fsum_rtl or fuzz_single_slice or fuzz_two_slices or dram_range_ending_at_4gib or count_fields_are_immediates or gather_dst_through_registers or gathers_through_the_hub or tmem_random_traffic or tmem_random_traffic_input_stage or tmem_dump_is_the_ram or mlp_4bit_rtl or run_arguments_start_in_r8_to_r15 or simulator_child_dies_with_its_parent or additive_mask_block_rtl"

  board-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Host driver and board-model regressions (AXI-Lite isolation already verified separately)
        run: pytest -q tests/test_board.py -k "not axil_iso_resets_apart"
