name: SUNNYONE remaining RTL and board regressions

# Serialise bounded RTL groups; board tests run only after every RTL group succeeds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/**'
      - 'opentpu/**'
      - 'tests/test_rtl.py'
      - 'tests/test_board.py'
      - 'tests/test_axil_iso.py'
      - 'tests/conftest.py'
      - 'sim/verilator/**'
      - '.github/workflows/sunnyone-rtl-functional.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-uncovered:
    name: RTL uncovered — group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Groups 1 and 2 passed in run #118 at the same test_rtl.py blob
          # (84cdfed65c2c9d3604e51080ce88d878fc71a76a); do not rerun unchanged tests.
          # Keep the expensive hub-gather simulations isolated from the shorter TMEM/MLP checks.
          - group: "3.1"
            selection: "gathers_through_the_hub"
          - group: "3.2"
            selection: "tmem_random_traffic or tmem_random_traffic_input_stage or tmem_dump_is_the_ram or mlp_4bit_rtl"
          - group: 4
            selection: "run_arguments_start_in_r8_to_r15 or simulator_child_dies_with_its_parent or additive_mask_block_rtl"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build pinned Verilator 5.044 (fixes function inlining on NBA RHS)
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex libfl-dev bison ccache libgoogle-perftools-dev numactl perl-doc
          dpkg -L libfl-dev | grep -F '/FlexLexer.h'
          test -f /usr/include/FlexLexer.h
          git clone --depth 1 --branch v5.044 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version | grep -F 'Verilator 5.044'
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run bounded RTL selection
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -ra tests/test_rtl.py -k "${{ matrix.selection }}" 2>&1 | tee "/tmp/sunnyone-rtl-uncovered-${{ matrix.group }}.log"
      - name: Upload RTL group log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-rtl-uncovered-${{ matrix.group }}-log
          path: /tmp/sunnyone-rtl-uncovered-${{ matrix.group }}.log
          if-no-files-found: warn

  board-functional:
    needs: rtl-uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Host driver and board-model regressions (AXI-Lite isolation already verified separately)
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -ra tests/test_board.py -k "not axil_iso_resets_apart" 2>&1 | tee /tmp/sunnyone-board-functional.log
      - name: Upload board-functional log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-board-functional-log
          path: /tmp/sunnyone-board-functional.log
          if-no-files-found: warn
