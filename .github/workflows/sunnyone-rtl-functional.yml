name: SUNNYONE RTL functional expansion
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/**'
      - 'opentpu/**'
      - 'tests/test_rtl.py'
      - 'tests/conftest.py'
      - '.github/workflows/sunnyone-rtl-functional.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Expanded RTL versus ISA tests
        run: >-
          pytest -q tests/test_rtl.py
          -k "axi_read_bursts or axi_sw_partial_beat_order or axi_sw_rmw_fuzz or dma_alignment_stress"
