name: SUNNYONE virtual DRAM RTL tests

# Cancel superseded runs of this same suite on newer commits; preserve other suites.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/mem/otpu_dram.sv'
      - 'rtl/mem/otpu_tmem.sv'
      - 'rtl/tech/generic/otpu_tech_ram.sv'
      - 'sim/verilator/tb_sunnyone_dram.sv'
      - 'sim/verilator/tb_sunnyone_tmem.sv'
      - 'sim/verilator/tb_sunnyone_tmem_multi.sv'
      - '.github/workflows/sunnyone-virtual-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  virtual-dram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Compile behavioural DRAM testbench
        run: verilator --binary --timing -Wall -Wno-fatal --top-module tb_sunnyone_dram --Mdir /tmp/obj_dir rtl/mem/otpu_dram.sv sim/verilator/tb_sunnyone_dram.sv
      - name: Run virtual memory tests
        run: |
          set -o pipefail
          /tmp/obj_dir/Vtb_sunnyone_dram | tee /tmp/sunnyone-dram-test.log
      - name: Require explicit DRAM pass marker
        run: grep -q 'DRAMTEST PASS:' /tmp/sunnyone-dram-test.log
      - name: Compile behavioural TMEM testbench
        run: verilator --binary --timing -Wall -Wno-fatal --top-module tb_sunnyone_tmem --Mdir /tmp/obj_tmem rtl/tech/generic/otpu_tech_ram.sv rtl/mem/otpu_tmem.sv sim/verilator/tb_sunnyone_tmem.sv
      - name: Run virtual TMEM tests
        run: |
          set -o pipefail
          /tmp/obj_tmem/Vtb_sunnyone_tmem | tee /tmp/sunnyone-tmem-test.log
      - name: Require explicit TMEM pass marker
        run: grep -q 'TMEMTEST PASS:' /tmp/sunnyone-tmem-test.log
      - name: Compile multi-port TMEM testbench
        run: verilator --binary --timing -Wall -Wno-fatal --top-module tb_sunnyone_tmem_multi --Mdir /tmp/obj_tmem_multi rtl/tech/generic/otpu_tech_ram.sv rtl/mem/otpu_tmem.sv sim/verilator/tb_sunnyone_tmem_multi.sv
      - name: Run multi-port TMEM tests
        run: |
          set -o pipefail
          /tmp/obj_tmem_multi/Vtb_sunnyone_tmem_multi | tee /tmp/sunnyone-tmem-multi-test.log
      - name: Require explicit multi-port TMEM pass marker
        run: grep -q 'TMEM_MULTI PASS:' /tmp/sunnyone-tmem-multi-test.log

      - name: Archive virtual-memory regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-virtual-memory-logs
          path: /tmp/sunnyone-*-test.log
          if-no-files-found: ignore
