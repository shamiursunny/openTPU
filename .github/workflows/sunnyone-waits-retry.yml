name: SUNNYONE WAITC verification retry

# Re-run the complete waits module in two serial partitions. The RTL FOLLOW
# matrix previously consumed nearly the entire 45-minute job budget by itself.
# No tests or assertions are removed; the selectors are disjoint and exhaustive.
concurrency:
  group: sunnyone-waits-retry-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waits-general:
    name: WAITC — all tests except RTL FOLLOW
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest transformers && python -m pip install -e .
      - name: Run WAITC tests excluding RTL FOLLOW
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -ra tests/test_waits.py -k 'not test_waitc_rtl_follow' 2>&1 | tee /tmp/sunnyone-waits-general.log
      - name: Upload WAITC general log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-waits-general-log
          path: /tmp/sunnyone-waits-general.log
          if-no-files-found: warn

  waits-rtl-follow:
    name: WAITC — four RTL FOLLOW configurations
    needs: waits-general
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest transformers && python -m pip install -e .
      - name: Run all RTL FOLLOW parameter cases
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -ra tests/test_waits.py -k 'test_waitc_rtl_follow' 2>&1 | tee /tmp/sunnyone-waits-rtl-follow.log
      - name: Upload RTL FOLLOW log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-waits-rtl-follow-log
          path: /tmp/sunnyone-waits-rtl-follow.log
          if-no-files-found: warn
