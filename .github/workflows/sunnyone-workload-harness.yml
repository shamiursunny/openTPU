name: SUNNYONE workload harness tests (metric fixture correction)

# Cancel superseded runs of this same suite on newer commits; preserve other suites.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'tools/sunnyone/endpoint_benchmark.py'
      - 'tools/sunnyone/resource_event_model.py'
      - 'tests/test_sunnyone_*.py'
      - '.github/workflows/sunnyone-workload-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile benchmark tools
        run: python -m py_compile tools/sunnyone/endpoint_benchmark.py tools/sunnyone/retrieval_benchmark.py tools/sunnyone/workload_trace.py tools/sunnyone/resource_event_model.py
      - name: Run deterministic SUNNYONE tests
        run: python -m unittest discover -s tests -p 'test_sunnyone_*.py' -v
