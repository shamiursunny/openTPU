name: SUNNYONE full-chip Verilator lint

# Cancel superseded runs of this same suite on newer commits; preserve other suites.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/mem/otpu_actram.sv'
      - 'rtl/mxu/otpu_mxu.sv'
      - 'rtl/**'
      - 'sim/verilator/tb_top.sv'
      - '.github/workflows/sunnyone-fullchip-lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fullchip-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint full-chip simulation top
        run: |
          set -o pipefail
          verilator --lint-only --timing -Wno-fatal --top-module tb_top \
            rtl/vpu/otpu_fp.sv rtl/vpu/otpu_fpipe.sv rtl/top/otpu_pkg.sv rtl/mem/otpu_dram.sv rtl/mem/otpu_tmem.sv \
            rtl/mem/otpu_native_dram.sv rtl/mem/otpu_xstg.sv rtl/mem/otpu_actram.sv rtl/seq/otpu_seq.sv \
            rtl/vpu/otpu_vtree.sv rtl/dma/otpu_dma.sv rtl/mxu/otpu_mxu.sv rtl/tech/generic/otpu_tech_dsp.sv \
            rtl/tech/generic/otpu_tech_ram.sv rtl/vpu/otpu_quant.sv rtl/vpu/otpu_se_comp.sv rtl/vpu/otpu_se_tail.sv \
            rtl/vpu/otpu_vpu.sv rtl/top/otpu_coll.sv rtl/exp/tmem_nocopy/otpu_tmem_model.sv \
            rtl/top/otpu_slice.sv rtl/top/otpu_top.sv sim/verilator/tb_top.sv 2>&1 | tee /tmp/sunnyone-fullchip-lint.log

      - name: Archive complete lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-fullchip-lint-log
          path: /tmp/sunnyone-fullchip-lint.log
          if-no-files-found: ignore
