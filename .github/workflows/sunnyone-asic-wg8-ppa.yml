name: SUNNYONE WG8 ASIC research PPA

# Cancel superseded runs of this same suite on newer commits; preserve other suites.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    # Only synthesized WG8 sources/configuration or an explicit request marker start PPA.
    # The workflow file itself is intentionally excluded to prevent self-trigger loops.
    paths:
      - 'targets/nangate45.toml'
      - 'rtl/asic/**'
      - 'rtl/vpu/otpu_fp.sv'
      - 'rtl/vpu/otpu_fpipe.sv'
      - 'rtl/top/otpu_pkg.sv'
      - 'rtl/mem/otpu_tmem.sv'
      - 'rtl/mem/otpu_actram.sv'
      - 'rtl/seq/otpu_seq.sv'
      - 'rtl/vpu/otpu_vtree.sv'
      - 'rtl/dma/otpu_dma.sv'
      - 'rtl/mxu/otpu_mxu.sv'
      - 'rtl/vpu/otpu_quant.sv'
      - 'rtl/vpu/otpu_se_comp.sv'
      - 'rtl/vpu/otpu_se_tail.sv'
      - 'rtl/vpu/otpu_vpu.sv'
      - 'rtl/top/otpu_coll.sv'
      - 'rtl/top/otpu_slice.sv'
      - 'rtl/tech/generic/otpu_tech_dsp.sv'
      - 'rtl/tech/asic/otpu_tech_ram.sv'
      - 'tools/asic/**'
      - 'opentpu/target.py'
      - 'docs/sunnyone/PPA_REQUEST.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wg8-ppa:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pin ORFS image for this run
        run: |
          set -euo pipefail
          docker pull openroad/orfs:latest
          image_id="$(docker image inspect openroad/orfs:latest --format '{{.Id}}')"
          test -n "${image_id}"
          printf '%s\n' "${image_id}" | tee /tmp/orfs-image-id.txt
          echo "ORFS_IMAGE=${image_id}" >> "${GITHUB_ENV}"
      - name: Capture host resource baseline
        run: |
          set -euo pipefail
          {
            date -u
            echo "=== /proc/meminfo ==="
            cat /proc/meminfo
            echo "=== filesystem ==="
            df -h
            echo "=== limits ==="
            ulimit -a
          } > /tmp/wg8-host-resource-before.txt
      - name: Run pinned-container SRAM probe and WG8 ORFS flow
        run: |
          set -euo pipefail
          image_id="$(cat /tmp/orfs-image-id.txt)"
          docker run --rm --cpus 2 -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "${image_id}" bash -lc '
            set -euo pipefail
            apt-get update
            apt-get install -y python3-numpy
            export ORFS_HOME=/OpenROAD-flow-scripts
            test -f "$ORFS_HOME/env.sh"
            source "$ORFS_HOME/env.sh"
            export YOSYS="$ORFS_HOME/tools/install/yosys/bin/yosys"
            test -x "$YOSYS"
            "$YOSYS" -V
            # Apply the two-CPU limit at the Docker boundary as well as in ORFS.
            # Capture cgroup memory limits, current/peak use and event counters while
            # the flow runs; retain telemetry even when OpenROAD exits non-zero.
            export ORFS_CPUS=2
            mkdir -p build/asic/nangate45-wg8/diagnostics
            telemetry=/workspace/build/asic/nangate45-wg8/diagnostics/resource-telemetry.log
            marker=/tmp/wg8-flow-finished
            rm -f "$marker"
            {
              date -u
              echo "=== uname ==="; uname -a
              echo "=== process cgroup ==="; cat /proc/self/cgroup
              echo "=== initial meminfo ==="; cat /proc/meminfo
              for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.usage_in_bytes /sys/fs/cgroup/memory/memory.max_usage_in_bytes /sys/fs/cgroup/memory/memory.failcnt; do
                if [ -r "$f" ]; then echo "=== $f ==="; cat "$f"; fi
              done
            } > "$telemetry"
            (
              while [ ! -e "$marker" ]; do
                {
                  echo "=== sample $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                  for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory/memory.usage_in_bytes /sys/fs/cgroup/memory/memory.max_usage_in_bytes /sys/fs/cgroup/memory/memory.failcnt; do
                    if [ -r "$f" ]; then echo "--- $f"; cat "$f"; fi
                  done
                } >> "$telemetry"
                sleep 5
              done
            ) &
            monitor_pid=$!
            finish_monitor() {
              touch "$marker"
              wait "$monitor_pid" || true
              {
                echo "=== final sample $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
                for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory/memory.usage_in_bytes /sys/fs/cgroup/memory/memory.max_usage_in_bytes /sys/fs/cgroup/memory/memory.failcnt; do
                  if [ -r "$f" ]; then echo "--- $f"; cat "$f"; fi
                done
                echo "=== final meminfo ==="; cat /proc/meminfo
              } >> "$telemetry"
            }
            trap finish_monitor EXIT
            python3 tools/asic/flow.py prep nangate45-wg8
            python3 tools/asic/flow.py config nangate45-wg8
            python3 tools/asic/flow.py run nangate45-wg8
            python3 tools/asic/flow.py report nangate45-wg8
          '
      - name: Collect WG8 PPA file inventory
        if: always()
        run: |
          set -euo pipefail
          cp /tmp/wg8-host-resource-before.txt /tmp/wg8-host-resource-before-copy.txt 2>/dev/null || true
          find build/asic/nangate45-wg8 -maxdepth 7 -type f | sort > /tmp/wg8-files.txt || true
          if [ -f build/asic/nangate45-wg8/run.log ]; then
            tail -c 200000 build/asic/nangate45-wg8/run.log > /tmp/wg8-run-tail.txt
          fi
          find build/asic/nangate45-wg8/work/logs build/asic/nangate45-wg8/work/reports -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -80 > /tmp/wg8-diagnostic-file-sizes.txt || true
          if [ -f build/asic/nangate45-wg8/report.json ]; then
            cp build/asic/nangate45-wg8/report.json /tmp/wg8-report.json
          fi
      - name: Upload WG8 PPA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-nangate45-wg8-ppa
          path: |
            /tmp/orfs-image-id.txt
            /tmp/wg8-files.txt
            /tmp/wg8-run-tail.txt
            /tmp/wg8-diagnostic-file-sizes.txt
            /tmp/wg8-report.json
            build/asic/nangate45-wg8/src/tiles.json
            build/asic/nangate45-wg8/config.mk
            build/asic/nangate45-wg8/constraint.sdc
            build/asic/nangate45-wg8/work/logs/**
            build/asic/nangate45-wg8/work/reports/**
          if-no-files-found: ignore
