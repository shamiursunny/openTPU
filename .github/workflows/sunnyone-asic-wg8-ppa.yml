name: SUNNYONE WG8 ASIC research PPA
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'targets/nangate45-wg8.toml'
      - 'rtl/asic/otpu_asic_top.sv'
      - 'rtl/**'
      - 'tools/asic/**'
      - 'opentpu/target.py'
      - '.github/workflows/sunnyone-asic-wg8-ppa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wg8-ppa:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pin ORFS image for this run
        run: |
          set -euo pipefail
          docker pull openroad/orfs:latest
          image_id="$(docker image inspect openroad/orfs:latest --format '{{.Id}}')"
          test -n "${image_id}"
          printf '%s\n' "${image_id}" | tee /tmp/orfs-image-id.txt
          echo "ORFS_IMAGE=${image_id}" >> "${GITHUB_ENV}"
      - name: Run pinned-container SRAM probe and WG8 ORFS flow
        run: |
          set -euo pipefail
          image_id="$(cat /tmp/orfs-image-id.txt)"
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "${image_id}" bash -lc '
            set -euo pipefail
            apt-get update
            apt-get install -y python3-numpy
            export ORFS_HOME=/OpenROAD-flow-scripts
            test -f "$ORFS_HOME/env.sh"
            source "$ORFS_HOME/env.sh"
            export YOSYS="$ORFS_HOME/tools/install/yosys/bin/yosys"
            test -x "$YOSYS"
            "$YOSYS" -V
            python3 tools/asic/flow.py prep nangate45-wg8
            python3 tools/asic/flow.py config nangate45-wg8
            python3 tools/asic/flow.py run nangate45-wg8
            python3 tools/asic/flow.py report nangate45-wg8
          '
      - name: Collect WG8 PPA file inventory
        if: always()
        run: |
          find build/asic/nangate45-wg8 -maxdepth 7 -type f | sort > /tmp/wg8-files.txt || true
          if [ -f build/asic/nangate45-wg8/run.log ]; then
            tail -c 200000 build/asic/nangate45-wg8/run.log > /tmp/wg8-run-tail.txt
          fi
          find build/asic/nangate45-wg8/work/logs build/asic/nangate45-wg8/work/reports -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -80 > /tmp/wg8-diagnostic-file-sizes.txt || true
          if [ -f build/asic/nangate45-wg8/report.json ]; then
            cp build/asic/nangate45-wg8/report.json /tmp/wg8-report.json
          fi
      - name: Upload WG8 PPA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-nangate45-wg8-ppa
          path: |
            /tmp/orfs-image-id.txt
            /tmp/wg8-files.txt
            /tmp/wg8-run-tail.txt
            /tmp/wg8-diagnostic-file-sizes.txt
            /tmp/wg8-report.json
            build/asic/nangate45-wg8/src/tiles.json
            build/asic/nangate45-wg8/config.mk
            build/asic/nangate45-wg8/constraint.sdc
            build/asic/nangate45-wg8/work/logs/**
            build/asic/nangate45-wg8/work/reports/**
          if-no-files-found: ignore
