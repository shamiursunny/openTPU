name: SUNNYONE random power-up failure A/B reproduction

on:
  push:
    branches: [sunnyone/commercial-profitability-architecture-2026-11-23]
    paths:
      - '.github/workflows/sunnyone-powerup-ab.yml'
  workflow_dispatch:

concurrency:
  group: sunnyone-powerup-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fsum-guard
            ref: ebd3e4c95d9adb027fe01b81342492e4bf7f4e9a
          - label: pre-fsum-guard
            ref: 0d367ba1906b8e187e6e2feb2db576364d85b4fb
    name: Power-up repro (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Reproduce the exact failing parameter
        run: |
          set -o pipefail
          pytest -q 'tests/test_rtl.py::test_random_power_up[1-3]' 2>&1 | tee /tmp/powerup-ab.log
      - name: Archive reproduction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerup-ab-${{ matrix.label }}
          path: /tmp/powerup-ab.log
          if-no-files-found: ignore
