name: SUNNYONE PCIe Gen2 XDMA bridge simulation
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/shell/otpu_mem_ch.sv'
      - 'rtl/shell/otpu_axi_split2.sv'
      - 'rtl/shell/otpu_afifo.sv'
      - 'rtl/boards/ypcb-00338/otpu_native_sys.sv'
      - 'sim/verilator/tb_memch.sv'
      - 'sim/verilator/otpu_ldn_model.sv'
      - 'sim/verilator/otpu_ldc_model.sv'
      - 'sim/verilator/otpu_ldc_ch.v'
      - 'tools/memch_test.py'
      - '.github/workflows/sunnyone-pcie-gen2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pcie-gen2-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Verilator 5.044
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex libfl-dev bison ccache libgoogle-perftools-dev numactl perl-doc
          test -f /usr/include/FlexLexer.h
          git clone --depth 1 --branch v5.044 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version | grep -F 'Verilator 5.044'
      - name: Run PCIe Gen2 XDMA bridge scenarios
        run: python tools/memch_test.py pcie
