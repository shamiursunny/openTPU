name: SUNNYONE core software and ISA unit tests
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'opentpu/**'
      - 'tests/test_isa.py'
      - 'tests/test_compiler.py'
      - 'tests/test_kernels.py'
      - 'tests/test_quant.py'
      - 'tests/test_formats.py'
      - 'tests/test_vops.py'
      - 'tests/test_fp.py'
      - 'tests/test_mx.py'
      - 'tests/test_stream.py'
      - 'tests/test_dataflow.py'
      - 'tests/test_waits.py'
      - 'tests/test_waitw.py'
      - 'tests/test_host.py'
      - 'tests/test_host_lock.py'
      - 'tests/test_host_runs.py'
      - 'sim/verilator/**'
      - '.github/workflows/sunnyone-software-core.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Core ISA, compiler, kernels, numerics and host software
        run: >-
          pytest -q
          tests/test_isa.py
          tests/test_compiler.py
          tests/test_kernels.py
          tests/test_quant.py
          tests/test_formats.py
          tests/test_vops.py
          tests/test_fp.py
          tests/test_mx.py
          tests/test_stream.py
          tests/test_dataflow.py
          tests/test_waits.py
          tests/test_waitw.py
          tests/test_host.py
          tests/test_host_lock.py
          tests/test_host_runs.py
