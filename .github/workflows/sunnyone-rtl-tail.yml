name: SUNNYONE remaining RTL tail regressions

# Cancel superseded runs of this same suite on newer commits; preserve other suites.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'tests/test_rtl.py'
      - 'rtl/**'
      - 'opentpu/**'
      - 'sim/verilator/**'
      - '.github/workflows/sunnyone-rtl-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-tail:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[POWERUP-REPRO]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Remaining non-experimental RTL/ISA regressions
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_rtl.py -k "random_power_up or mxu_reads_on_the_card_tmem or one_copy_two_writers or one_copy_two_writes_replays_make_progress or collective_reads_held_behind_dma_reads or act_reads_follow_the_mm_rows or lane_count_does_not_change_results or ldc_sequential_is_the_card_bist" 2>&1 | tee /tmp/sunnyone-rtl-tail.log
      - name: Archive RTL tail regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-rtl-tail-log
          path: /tmp/sunnyone-rtl-tail.log
          if-no-files-found: ignore

  powerup-ab:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[POWERUP-REPRO]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fsum-guard
            ref: ebd3e4c95d9adb027fe01b81342492e4bf7f4e9a
          - label: pre-fsum-guard
            ref: 0d367ba1906b8e187e6e2feb2db576364d85b4fb
    name: Power-up A/B (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Reproduce exact failing parameter
        run: |
          set -o pipefail
          pytest -q 'tests/test_rtl.py::test_random_power_up[1-3]' 2>&1 | tee /tmp/powerup-ab.log
      - name: Archive reproduction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerup-ab-${{ matrix.label }}
          path: /tmp/powerup-ab.log
          if-no-files-found: ignore
