name: SUNNYONE ASIC and target configuration checks
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'tests/test_asic_flow.py'
      - 'tests/test_target.py'
      - 'tests/test_rtlsim_build.py'
      - 'tools/asic/**'
      - 'opentpu/target.py'
      - 'targets/**'
      - 'rtl/**'
      - '.github/workflows/sunnyone-asic-config.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asic-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Verify ASIC points, target contracts and simulator build cache
        run: |
          set -o pipefail
          pytest -q tests/test_asic_flow.py tests/test_target.py tests/test_rtlsim_build.py
          | tee /tmp/sunnyone-asic-config.log
      - name: Lint integrated ASIC control and compute top
        run: |
          set -o pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import flow
          sources = [str(p) for p in flow.sources("card")]
          sources += ["rtl/asic/otpu_asic_ctrl.sv", "rtl/asic/otpu_asic_chip_top.sv",
                      "rtl/mem/otpu_native_dram.sv", "rtl/asic/otpu_asic_mem_top.sv"]
          cmd = ["verilator", "--lint-only", "--timing", "-Wno-fatal",
                 "--top-module", "otpu_asic_chip_top", *sources]
          with open("/tmp/sunnyone-asic-chip-lint.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-chip-lint.log").read()[-12000:])
          raise SystemExit(result.returncode)
          PY
      - name: Lint integrated WG8 native-memory top
        run: |
          set -o pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import flow
          sources = [str(p) for p in flow.sources("nangate45-wg8")]
          sources += ["rtl/asic/otpu_asic_ctrl.sv", "rtl/asic/otpu_asic_chip_top.sv",
                      "rtl/mem/otpu_native_dram.sv", "rtl/asic/otpu_asic_mem_top.sv"]
          cmd = ["verilator", "--lint-only", "--timing", "-Wno-fatal",
                 "--top-module", "otpu_asic_mem_top", *sources]
          with open("/tmp/sunnyone-asic-mem-lint.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-mem-lint.log").read()[-16000:])
          raise SystemExit(result.returncode)
          PY
      - name: Archive configuration test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-asic-config-log
          path: |
            /tmp/sunnyone-asic-config.log
            /tmp/sunnyone-asic-chip-lint.log
            /tmp/sunnyone-asic-mem-lint.log
          if-no-files-found: ignore
