name: SUNNYONE ASIC and target configuration checks
# Keep all four-DIMM, address-map and HMUX contention benches in this exact-SHA qualification gate.
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'tests/test_asic_flow.py'
      - 'tests/test_target.py'
      - 'tests/test_rtlsim_build.py'
      - 'tools/asic/**'
      - 'opentpu/target.py'
      - 'targets/**'
      - 'rtl/**'
      - 'sim/verilator/tb_asic_wg8_ddr4.sv'
      - 'sim/verilator/tb_asic_global_addr_map.sv'
      - 'sim/verilator/tb_asic_wg8_hmux_contention.sv'
      - 'sim/verilator/asic_sram_lint_stubs.sv'
      - '.github/workflows/sunnyone-asic-config.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asic-config:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Verify ASIC points, target contracts and simulator build cache
        run: |
          set -o pipefail
          pytest -q tests/test_asic_flow.py tests/test_target.py tests/test_rtlsim_build.py 2>&1 | tee /tmp/sunnyone-asic-config.log
      - name: Lint integrated ASIC control and compute top
        run: |
          set -o pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import flow
          sources = [str(p) for p in flow.sources("card")]
          sources += ["sim/verilator/asic_sram_lint_stubs.sv"]
          sources += ["rtl/asic/otpu_asic_ctrl.sv", "rtl/asic/otpu_asic_chip_top.sv",
                      "rtl/mem/otpu_native_dram.sv", "rtl/asic/otpu_asic_mem_top.sv"]
          from pathlib import Path
          sources = list(dict.fromkeys(str(Path(p).resolve()) for p in sources))
          cmd = ["verilator", "--lint-only", "--timing", "-Wno-fatal", "-DSYNTHESIS",
                 "--top-module", "otpu_asic_chip_top", *sources]
          with open("/tmp/sunnyone-asic-chip-lint.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-chip-lint.log").read()[-12000:])
          raise SystemExit(result.returncode)
          PY
      - name: Lint integrated WG8 native-memory top
        run: |
          set -o pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import flow
          sources = [str(p) for p in flow.sources("nangate45-wg8")]
          sources += ["sim/verilator/asic_sram_lint_stubs.sv"]
          sources += ["rtl/asic/otpu_asic_ctrl.sv", "rtl/asic/otpu_asic_chip_top.sv",
                      "rtl/mem/otpu_native_dram.sv", "rtl/asic/otpu_asic_mem_top.sv"]
          cmd = ["verilator", "--lint-only", "--timing", "-Wno-fatal", "-DSYNTHESIS",
                 "--top-module", "otpu_asic_mem_top", *sources]
          with open("/tmp/sunnyone-asic-mem-lint.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-mem-lint.log").read()[-16000:])
          raise SystemExit(result.returncode)
          PY
      - name: Lint integrated WG8 four-DIMM AXI top
        run: |
          set -o pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import flow
          import opentpu.target as target
          sources = ["rtl/" + p for p in target.sources("bcu1525-wg", family="generic")]
          sources += ["rtl/asic/otpu_asic_top.sv", "rtl/asic/otpu_asic_ctrl.sv",
                      "rtl/asic/otpu_asic_chip_top.sv", "rtl/mem/otpu_native_dram.sv",
                      "rtl/asic/otpu_asic_mem_top.sv", "rtl/asic/otpu_asic_wg8_ddr4_top.sv"]
          from pathlib import Path
          sources = list(dict.fromkeys(str(Path(p).resolve()) for p in sources))
          cmd = ["verilator", "--lint-only", "--timing", "-Wno-fatal", "-DSYNTHESIS",
                 "--top-module",
                 "otpu_asic_wg8_ddr4_top", *sources]
          with open("/tmp/sunnyone-asic-wg8-ddr4-lint.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-wg8-ddr4-lint.log").read()[-18000:])
          raise SystemExit(result.returncode)
          PY
      - name: Simulate four-DIMM WG8 host AXI integration
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import opentpu.target as target
          sources = ["rtl/" + p for p in target.sources("bcu1525-wg", family="generic")]
          sources += ["rtl/asic/otpu_asic_top.sv", "rtl/asic/otpu_asic_ctrl.sv",
                      "rtl/asic/otpu_asic_chip_top.sv", "rtl/mem/otpu_native_dram.sv",
                      "rtl/asic/otpu_asic_mem_top.sv", "rtl/asic/otpu_asic_wg8_ddr4_top.sv",
                      "sim/verilator/tb_asic_wg8_ddr4.sv"]
          from pathlib import Path
          sources = list(dict.fromkeys(str(Path(p).resolve()) for p in sources))
          cmd = ["verilator", "--binary", "--timing", "--assert", "-Wall", "-Wno-fatal",
                 "--top-module", "tb_asic_wg8_ddr4", *sources]
          with open("/tmp/sunnyone-asic-wg8-ddr4-sim-build.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-wg8-ddr4-sim-build.log").read()[-16000:])
          if result.returncode:
              raise SystemExit(result.returncode)
          result = subprocess.run(["./obj_dir/Vtb_asic_wg8_ddr4"], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode:
              raise SystemExit(result.returncode)
          expected = "WG8 host DMA address exceeds 8-GiB DIMM aperture"
          for mode in ("bad_aw", "bad_ar"):
              negative = subprocess.run(["./obj_dir/Vtb_asic_wg8_ddr4", "+" + mode],
                                         capture_output=True, text=True)
              output = negative.stdout + negative.stderr
              print(output)
              if negative.returncode == 0 or expected not in output:
                  raise SystemExit(f"{mode}: expected host-address aperture fatal was not observed")
              print(f"PASS: {mode} correctly rejected an address outside the 8-GiB DIMM aperture")
          PY
      - name: Simulate global-to-DIMM address mapping
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          cmd = ["verilator", "--binary", "--timing", "--assert", "-Wall", "-Wno-fatal",
                 "--Mdir", "obj_dir_global_addr_map", "--top-module", "tb_asic_global_addr_map",
                 "rtl/asic/otpu_asic_global_addr_map.sv", "sim/verilator/tb_asic_global_addr_map.sv"]
          log_path = "/tmp/sunnyone-asic-global-addr-map-build.log"
          with open(log_path, "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          with open(log_path) as log:
              print(log.read()[-12000:])
          if result.returncode:
              raise SystemExit(result.returncode)
          result = subprocess.run(["./obj_dir_global_addr_map/Vtb_asic_global_addr_map"],
                                  capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          raise SystemExit(result.returncode)
          PY
      - name: Simulate four-DIMM host/accelerator mux contention
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools/asic")
          import opentpu.target as target
          sources = ["rtl/" + p for p in target.sources("bcu1525-wg", family="generic")]
          sources += ["sim/verilator/tb_asic_wg8_hmux_contention.sv"]
          from pathlib import Path
          sources = list(dict.fromkeys(str(Path(p).resolve()) for p in sources))
          cmd = ["verilator", "--binary", "--timing", "--assert", "-DHMUX_FORMAL", "-Wall", "-Wno-fatal",
                 "--top-module", "tb_asic_wg8_hmux_contention", *sources]
          with open("/tmp/sunnyone-asic-hmux-contention-build.log", "w") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
          print(open("/tmp/sunnyone-asic-hmux-contention-build.log").read()[-18000:])
          if result.returncode:
              raise SystemExit(result.returncode)
          result = subprocess.run(["./obj_dir/Vtb_asic_wg8_hmux_contention"], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          raise SystemExit(result.returncode)
          PY
      - name: Archive configuration test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-asic-config-log
          path: |
            /tmp/sunnyone-asic-config.log
            /tmp/sunnyone-asic-chip-lint.log
            /tmp/sunnyone-asic-mem-lint.log
            /tmp/sunnyone-asic-wg8-ddr4-lint.log
            /tmp/sunnyone-asic-wg8-ddr4-sim-build.log
            /tmp/sunnyone-asic-hmux-contention-build.log
            /tmp/sunnyone-asic-global-addr-map-build.log
          if-no-files-found: ignore
