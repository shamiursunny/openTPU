name: SUNNYONE QHL seed-1 reset-qualified regression

on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - '.github/workflows/sunnyone-qhl-reset-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qhl-seed-1:
    name: QHL seed-1 reset-qualified regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run exact QHL seed-1 power-up regression
        shell: bash
        run: |
          set -o pipefail
          pytest -q -s -ra 'tests/test_quant_rtl.py::test_qhl_power_up_rtl[1-False]' 2>&1 | tee /tmp/qhl-seed1-reset-qualified.log
      - name: Upload QHL regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-qhl-seed1-reset-qualified
          path: /tmp/qhl-seed1-reset-qualified.log
          if-no-files-found: warn
