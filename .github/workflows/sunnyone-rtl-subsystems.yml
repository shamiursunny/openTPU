name: SUNNYONE additional RTL subsystem regressions
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/**'
      - 'opentpu/**'
      - 'tests/test_stream_rtl.py'
      - 'tests/test_quant_rtl.py'
      - 'tests/test_fp_rtl.py'
      - 'tests/test_icache_rtl.py'
      - 'tests/test_waitw_rtl.py'
      - 'tests/test_aw_rtl.py'
      - 'tests/test_coll_hub.py'
      - 'tests/test_dma_lda.py'
      - 'tests/test_dma_ldq.py'
      - 'tests/test_native_dram.py'
      - 'tests/test_reset_audit.py'
      - 'tests/test_tech_ram.py'
      - 'tests/test_scoreboard.py'
      - 'sim/verilator/**'
      - 'sim/tech/**'
      - '.github/workflows/sunnyone-rtl-subsystems.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-subsystems:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Additional DMA, stream, quantisation, memory and subsystem regressions
        run: >-
          pytest -q
          tests/test_stream_rtl.py tests/test_quant_rtl.py tests/test_fp_rtl.py tests/test_icache_rtl.py tests/test_waitw_rtl.py tests/test_aw_rtl.py tests/test_coll_hub.py tests/test_dma_lda.py tests/test_dma_ldq.py tests/test_native_dram.py tests/test_reset_audit.py tests/test_tech_ram.py tests/test_scoreboard.py
