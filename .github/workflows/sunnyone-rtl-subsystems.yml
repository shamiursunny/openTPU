name: SUNNYONE RTL subsystems and WG8 memory regressions
on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/**'
      - 'opentpu/**'
      - 'tests/test_stream_rtl.py'
      - 'tests/test_quant_rtl.py'
      - 'tests/test_fp_rtl.py'
      - 'tests/test_icache_rtl.py'
      - 'tests/test_waitw_rtl.py'
      - 'tests/test_aw_rtl.py'
      - 'tests/test_coll_hub.py'
      - 'tests/test_dma_lda.py'
      - 'tests/test_dma_ldq.py'
      - 'tests/test_native_dram.py'
      - 'tests/test_reset_audit.py'
      - 'tests/test_tech_ram.py'
      - 'tests/test_scoreboard.py'
      - 'sim/verilator/**'
      - 'sim/tech/**'
      - '.github/workflows/sunnyone-rtl-subsystems.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-subsystems:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: Stream RTL
            tests: tests/test_stream_rtl.py
          - group: MX multiply and replay RTL
            tests: tests/test_quant_rtl.py::test_mm_mx_rtl tests/test_quant_rtl.py::test_mm_mx_replay_rtl
          - group: Quantizer modes RTL
            tests: tests/test_quant_rtl.py::test_quantizer_modes_rtl
          - group: Quantizer corners and tie rounding RTL
            tests: tests/test_quant_rtl.py::test_rscale_once_a_row_rtl tests/test_quant_rtl.py::test_wide_pass1_rtl tests/test_quant_rtl.py::test_quantizer_ties_qst_rtl tests/test_quant_rtl.py::test_quantizer_ties_qact_rtl
          - group: SPLITQ RTL
            tests: tests/test_quant_rtl.py::test_splitq_rtl
          - group: QHL RTL
            tests: tests/test_quant_rtl.py::test_qhl_rtl tests/test_quant_rtl.py::test_qhl_power_up_rtl tests/test_quant_rtl.py::test_qhl_cycles_rtl
          - group: QST and QSTB RTL
            tests: tests/test_quant_rtl.py::test_qst_sww_rtl tests/test_quant_rtl.py::test_qstb_rtl tests/test_quant_rtl.py::test_qstb_power_up_rtl tests/test_quant_rtl.py::test_qstb_cycles_rtl
          - group: Floating-point RTL
            tests: tests/test_fp_rtl.py
          - group: Instruction-cache RTL
            tests: tests/test_icache_rtl.py
          - group: Wait-state RTL
            tests: tests/test_waitw_rtl.py
          - group: Address-window RTL
            tests: tests/test_aw_rtl.py
          - group: Collective hub, DMA and scoreboard
            tests: tests/test_coll_hub.py tests/test_dma_lda.py tests/test_dma_ldq.py tests/test_scoreboard.py
          - group: Native DRAM and technology RAM
            tests: tests/test_native_dram.py tests/test_tech_ram.py
          - group: Reset audit
            tests: tests/test_reset_audit.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Install pinned Yosys with Slang for reset audit
        if: matrix.group == 'Reset audit'
        run: |
          set -euo pipefail
          version=2026-11-23
          archive="oss-cad-suite-linux-x64-20261123.tgz"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${version}/${archive}"
          curl --fail --location --retry 3 --retry-delay 2 "${url}" --output "${RUNNER_TEMP}/${archive}"
          echo "c01d93f2f9091ba7eeb18540334fa0aaefa843b343cbdd627fd7669391de47ba  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          source "${RUNNER_TEMP}/oss-cad-suite/environment"
          yosys="$(command -v yosys)"
          test -x "${yosys}"
          if "${yosys}" -m slang -Q -p 'help read_slang' >/dev/null 2>&1; then
            echo "YOSYS=${yosys}" >> "${GITHUB_ENV}"
          elif "${yosys}" -Q -p 'help read_slang' >/dev/null 2>&1; then
            echo "YOSYS=${yosys}" >> "${GITHUB_ENV}"
          else
            echo "Pinned OSS CAD Suite Yosys does not expose read_slang" >&2
            exit 1
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          IFS=: read -r -a suite_path_entries <<< "${PATH}"
          for path_entry in "${suite_path_entries[@]}"; do
            if [ -n "${path_entry}" ]; then printf '%s\n' "${path_entry}" >> "${GITHUB_PATH}"; fi
          done
          "${yosys}" -V
      - name: Run selected regression group
        env:
          TEST_TARGETS: ${{ matrix.tests }}
        run: |
          set -o pipefail
          pytest -q -rs ${TEST_TARGETS} --durations=20 2>&1 | tee /tmp/sunnyone-subsystems-${{ strategy.job-index }}.log
      - name: Archive regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-subsystems-${{ strategy.job-index }}-log
          path: /tmp/sunnyone-subsystems-${{ strategy.job-index }}.log
          if-no-files-found: ignore
