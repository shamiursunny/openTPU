name: SUNNYONE isolated stream software regression

# Isolated recovery for tests/test_stream.py; deliberately does not rerun the
# 14 successful software-core modules or any RTL regression groups.
concurrency:
  group: sunnyone-stream-software-only-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - '.github/workflows/sunnyone-stream-software-only.yml'

permissions:
  contents: read

jobs:
  stream-software:
    name: STREAM ISA and compiler tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out selected branch revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build pinned Verilator 5.044
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex libfl-dev bison ccache libgoogle-perftools-dev numactl perl-doc
          test -f /usr/include/FlexLexer.h
          git clone --depth 1 --branch v5.044 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version | grep -F 'Verilator 5.044'

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .

      - name: Run STREAM software regression only
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rs tests/test_stream.py --durations=20 2>&1 | tee /tmp/sunnyone-stream-software-only.log

      - name: Upload STREAM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-stream-software-only-log
          path: /tmp/sunnyone-stream-software-only.log
          if-no-files-found: warn
