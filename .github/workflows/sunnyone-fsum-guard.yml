name: SUNNYONE FSUM hardware bounds guard

on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/seq/otpu_seq.sv'
      - 'rtl/top/otpu_slice.sv'
      - 'tests/test_rtl.py'
      - '.github/workflows/sunnyone-fsum-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunnyone-fsum-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fsum-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Test FSUM bounds, feature gating and legal boundary
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -ra tests/test_rtl.py -k "fsum_exp2sub_invalid_shape_halts_before_vpu_dispatch_rtl or fsum_exp2sub_rejected_when_capability_disabled_rtl or fsum_take_rejected_when_capability_disabled_rtl or fsum_take_without_pending_producer_halts_before_vpu_dispatch_rtl or fsum_capability_requires_eight_lane_stream_unit_rtl or fsum_pending_at_halt_reports_error_after_drain_rtl or fsum_flag_rejected_on_unrelated_vop_function_rtl or fsum_exp2sub_maximum_legal_shape_runs_and_takes_rtl" 2>&1 | tee /tmp/sunnyone-fsum-guard.log
      - name: Archive FSUM guard test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-fsum-guard-log
          path: /tmp/sunnyone-fsum-guard.log
          if-no-files-found: ignore
