name: SUNNYONE board-functional only

# Board-only path: never depends on or reruns the completed RTL groups 3.1, 3.2 or 4.
concurrency:
  group: sunnyone-board-functional-only-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - '.github/workflows/sunnyone-board-functional-only.yml'
      - 'tests/test_board.py'
      - 'tests/conftest.py'
      - 'opentpu/**'
      - 'rtl/**'
      - 'sim/verilator/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  board-functional:
    name: Host driver and board-model regressions only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out selected branch revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build pinned Verilator 5.044
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex libfl-dev bison ccache libgoogle-perftools-dev numactl perl-doc
          test -f /usr/include/FlexLexer.h
          git clone --depth 1 --branch v5.044 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version | grep -F 'Verilator 5.044'

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .

      - name: Run board-functional regression (no RTL group matrix)
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -ra tests/test_board.py -k "not axil_iso_resets_apart" 2>&1 | tee /tmp/sunnyone-board-functional-only.log

      - name: Upload board-functional log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-board-functional-only-log
          path: /tmp/sunnyone-board-functional-only.log
          if-no-files-found: warn
