name: SUNNYONE sequencer loop-stack boundary tests

on:
  push:
    branches:
      - sunnyone/commercial-profitability-architecture-2026-11-23
    paths:
      - 'rtl/seq/otpu_seq.sv'
      - 'tests/test_rtl.py'
      - 'opentpu/isasim.py'
      - '.github/workflows/sunnyone-loop-stack-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunnyone-loop-stack-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop-stack-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Test legal depth and overflow rejection
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_rtl.py -k "loop_stack_maximum_legal_depth_four_rtl or loop_stack_overflow_reports_error_before_out_of_range_rtl" 2>&1 | tee /tmp/sunnyone-loop-stack-guard.log
      - name: Archive loop-stack guard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-loop-stack-guard-log
          path: /tmp/sunnyone-loop-stack-guard.log
          if-no-files-found: ignore
