name: SUNNYONE AI-X Baseline CI

on:
  push:
    branches:
      - main
      - "sunnyone/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunnyone-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    name: Python regression (optional model tests may skip if frameworks are unavailable)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml

      - name: Record source and tool versions
        run: |
          git rev-parse HEAD
          git status --short
          python --version
          python -m pip --version
          pytest --version

      - name: Run default Python regression suite
        run: |
          mkdir -p sunnyone-evidence
          pytest -q -ra --junitxml=sunnyone-evidence/pytest-junit.xml 2>&1 | tee sunnyone-evidence/pytest.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunnyone-python-regression-${{ github.sha }}
          path: sunnyone-evidence/
          if-no-files-found: warn
          retention-days: 30
